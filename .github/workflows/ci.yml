name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Regras de commit do CONTRIBUTING.md: prefixo feature/improvement/bugfix/hotfix e nada de Co-Authored-By.
  commit-messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Commit messages and pull request title follow CONTRIBUTING.md
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feature|improvement|bugfix|hotfix): [^ ]'
          bad=0
          while IFS= read -r line; do
            subject="${line#* }"
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Commit ${line%% *} must start with feature:, improvement:, bugfix: or hotfix: (see CONTRIBUTING.md): $subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          if git log --no-merges --format='%B' "$BASE..$HEAD" | grep -qi '^co-authored-by:'; then
            echo "::error::Remove the Co-Authored-By trailers from the commit messages (see CONTRIBUTING.md)."
            bad=1
          fi
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The pull request title must use the same format as a commit title (see CONTRIBUTING.md)."
            bad=1
          fi
          exit "$bad"

  check:
    # The app ships for Windows (NSIS) and Linux (AppImage, deb): the Git/shell tests run on both, like the product.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Git identity (some tests commit in temporary repositories)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  installer:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist
        env:
          # No signing certificate yet: the installer is built unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: GearMod-Setup
          path: apps/desktop/dist/GearMod-Setup-*.exe
          if-no-files-found: error

  installer-linux:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:linux
      - name: The in-app terminal (node-pty) is in the Linux package
        # There is no prebuilt node-pty for Linux: without its pty.node the agent login and the terminals fail to start.
        run: test -f apps/desktop/dist/linux-unpacked/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node
      - uses: actions/upload-artifact@v7
        with:
          name: GearMod-Linux
          path: |
            apps/desktop/dist/GearMod-*.AppImage
            apps/desktop/dist/GearMod-*.deb
          if-no-files-found: error

  installer-mac:
    needs: check
    # Apple Silicon runner; the Intel package is cross-built on it (electron-rebuild -a x64).
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: The native modules are in both Mac packages, built for the right processor
        run: |
          for pair in "mac-arm64:arm64" "mac:x86_64"; do
            folder=${pair%%:*}; arch=${pair##*:}
            unpacked="apps/desktop/dist/$folder/GearMod.app/Contents/Resources/app.asar.unpacked/node_modules"
            for module in node-pty/build/Release/pty.node better-sqlite3/build/Release/better_sqlite3.node; do
              file "$unpacked/$module" | tee /dev/stderr | grep -q "$arch" || { echo "::error::$module is not built for $arch in $folder"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v7
        with:
          name: GearMod-Mac
          path: apps/desktop/dist/GearMod-*.dmg
          if-no-files-found: error

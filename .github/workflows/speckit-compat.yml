name: Spec Kit compatibility

# Once a day, checks every recent Spec Kit release against what GearMod relies on (the skills, .specify/feature.json, the artifacts and the task format)
# and publishes the verdicts as an asset of a fixed prerelease, `speckit-compat`. GearMod reads that file, so nobody waits for a GearMod release to
# update Spec Kit and nobody has to run the check on their own machine. A version that breaks the contract opens an issue.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      reprobe:
        description: 'Ignore the saved verdicts and check every recent version again'
        type: boolean
        default: false

permissions:
  contents: write  # creates/updates the speckit-compat release asset
  issues: write    # reports a version that breaks the contract

concurrency:
  group: speckit-compat
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
      - name: Download the previous verdicts
        if: ${{ !inputs.reprobe }}
        run: curl -fsSL "https://github.com/${{ github.repository }}/releases/download/speckit-compat/speckit-compat.json" -o speckit-compat.json || rm -f speckit-compat.json
      - name: Probe the Spec Kit versions that have no verdict yet
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/speckit-compat.mjs speckit-compat.json
      - name: Publish the verdicts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view speckit-compat >/dev/null 2>&1 || gh release create speckit-compat \
            --prerelease --latest=false --target "${{ github.sha }}" \
            --title "Spec Kit compatibility" \
            --notes "Verdicts of the daily Spec Kit compatibility check, read by GearMod. Generated by speckit-compat.yml; not a GearMod version."
          gh release upload speckit-compat speckit-compat.json --clobber
      - name: Open an issue for each version that breaks the contract
        if: steps.probe.outputs.new_failures != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.probe.outputs.new_failures }}
        run: |
          for version in $FAILURES; do
            title="Spec Kit ${version} breaks GearMod's contract"
            if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              issues="$(node -e "const v=require('./speckit-compat.json').versions['$version'];console.log(v.issues.map(i=>'- '+i.severity+': '+i.detail).join('\n'))")"
              gh issue create --title "$title" --body "The daily compatibility check found that Spec Kit ${version} no longer fits what GearMod relies on, so the app does not offer that update.

          ${issues}

          Fix GearMod (or wait for a Spec Kit fix), then run this workflow manually with the reprobe option checked to verify the versions again."
            fi
          done

name: Release

# A version tag (e.g. v0.1.0) builds the Windows installer, the Linux packages (AppImage and deb, x64) and the Mac disk
# images (Apple Silicon and Intel) and publishes one Release with the five files and a single SHA256SUMS.txt. Nothing is published unless every package builds.
# The tag version must match apps/desktop/package.json. The packages are not code-signed yet (the Mac ones are only ad-hoc signed).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the app version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  installer-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Git identity (some tests commit in temporary repositories)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Installer exists
        shell: pwsh
        run: |
          $exe = "apps/desktop/dist/GearMod-Setup-$env:VERSION-x64.exe"
          if (-not (Test-Path $exe)) { throw "Installer not found: $exe" }
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: apps/desktop/dist/GearMod-Setup-${{ env.VERSION }}-x64.exe
          if-no-files-found: error

  installer-linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Git identity (some tests commit in temporary repositories)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - run: pnpm dist:linux
      - name: The in-app terminal (node-pty) is in the Linux package
        # There is no prebuilt node-pty for Linux: without its pty.node the agent login and the terminals fail to start.
        run: test -f apps/desktop/dist/linux-unpacked/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node

      - name: Packages exist
        run: |
          for file in "GearMod-$VERSION-x86_64.AppImage" "GearMod-$VERSION-amd64.deb"; do
            [ -f "apps/desktop/dist/$file" ] || { echo "::error::Package not found: $file"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            apps/desktop/dist/GearMod-${{ env.VERSION }}-x86_64.AppImage
            apps/desktop/dist/GearMod-${{ env.VERSION }}-amd64.deb
          if-no-files-found: error

  installer-mac:
    needs: version
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Git identity (some tests commit in temporary repositories)
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Disk images exist
        run: |
          for file in "GearMod-$VERSION-arm64.dmg" "GearMod-$VERSION-x64.dmg"; do
            [ -f "apps/desktop/dist/$file" ] || { echo "::error::Disk image not found: $file"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-mac
          path: |
            apps/desktop/dist/GearMod-${{ env.VERSION }}-arm64.dmg
            apps/desktop/dist/GearMod-${{ env.VERSION }}-x64.dmg
          if-no-files-found: error

  publish:
    # Runs only when every package job succeeds, so a Release never goes out with missing files.
    needs: [version, installer-windows, installer-linux, installer-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksum
        working-directory: release
        run: |
          exe="GearMod-Setup-$VERSION-x64.exe"
          appimage="GearMod-$VERSION-x86_64.AppImage"
          deb="GearMod-$VERSION-amd64.deb"
          dmg_arm="GearMod-$VERSION-arm64.dmg"
          dmg_intel="GearMod-$VERSION-x64.dmg"
          for file in "$exe" "$appimage" "$deb" "$dmg_arm" "$dmg_intel"; do
            [ -f "$file" ] || { echo "::error::Missing file: $file"; exit 1; }
          done
          sha256sum "$exe" "$appimage" "$deb" "$dmg_arm" "$dmg_intel" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          ### Windows

          Download **GearMod-Setup-@VERSION@-x64.exe** below and run it. Windows 10 or 11 (x64).

          The installer is not code-signed yet, so Windows SmartScreen may show "Windows protected your PC". Click **More info** and then **Run anyway**. You can check the download against `SHA256SUMS.txt` with:

          ```powershell
          Get-FileHash .\GearMod-Setup-@VERSION@-x64.exe -Algorithm SHA256
          ```

          ### Linux (x64)

          - **Debian, Ubuntu and derivatives:** download **GearMod-@VERSION@-amd64.deb** and install it with `sudo apt install ./GearMod-@VERSION@-amd64.deb`. GearMod shows up in the applications menu.
          - **Any distribution:** download **GearMod-@VERSION@-x86_64.AppImage**, then run `chmod +x GearMod-@VERSION@-x86_64.AppImage && ./GearMod-@VERSION@-x86_64.AppImage`. If it complains about FUSE, install `libfuse2` (`sudo apt install libfuse2t64` on Ubuntu 24.04, `libfuse2` on 22.04) or run it with `--appimage-extract-and-run`.

          Check the downloads against `SHA256SUMS.txt` with:

          ```sh
          sha256sum -c SHA256SUMS.txt --ignore-missing
          ```

          To save secrets (API keys, tokens), GearMod needs a keyring: gnome-keyring or KWallet.

          ### macOS

          Download **GearMod-@VERSION@-arm64.dmg** (Apple Silicon: M1 and later) or **GearMod-@VERSION@-x64.dmg** (Intel), open it and drag GearMod to Applications. macOS 12 or later.

          The app is not notarized by Apple yet, so macOS blocks the first launch ("GearMod is damaged" or "cannot be opened"). After copying it to Applications, run once in Terminal:

          ```sh
          xattr -dr com.apple.quarantine /Applications/GearMod.app
          ```

          Check the downloads with `shasum -a 256 -c SHA256SUMS.txt --ignore-missing`.
          NOTES
          sed -i "s/@VERSION@/$VERSION/g" notes.md
          extra=()
          if [[ "$VERSION" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "GearMod-Setup-$VERSION-x64.exe" \
            "GearMod-$VERSION-x86_64.AppImage" \
            "GearMod-$VERSION-amd64.deb" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "GearMod $VERSION" --notes-file notes.md --generate-notes "${extra[@]}"
